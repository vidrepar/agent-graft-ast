[package]
name = "agent-graft-ast"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Code-intelligence MCP server for AI coding agents: sub-millisecond symbol graph, budgeted file skeletons, and rename/change_signature tools that apply the edits."
license = "MIT OR Apache-2.0"
repository = "https://github.com/vidrepar/agent-graft-ast"
readme = "README.md"
keywords = ["mcp", "tree-sitter", "ai-agents", "refactoring", "code-intelligence"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
aho-corasick = "1.1.5"
anyhow = "1.0.104"
bpe-openai = "0.3.2"
clap = { version = "4.6.7", features = ["derive"] }
git2 = { version = "0.21.0", default-features = false }
ignore = "0.4.33"
libc = "0.2.191"
libmimalloc-sys = "0.1.49"
memchr = "2.8.3"
memmap2 = "0.9.12"
mimalloc = "0.1.52"
notify = "8.2.1"
once_cell = "1.21.4"
petgraph = "0.8.3"
rayon = "1.12.0"
redb = "4.4.0"
regex = "1.13.1"
rmp-serde = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "io-std", "io-util", "macros", "sync"] }
tree-sitter = "0.27.1"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-cpp = "0.23.4"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-lua = "0.5.0"
tree-sitter-php = "0.25.1"
tree-sitter-python = "0.25.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.2"
tree-sitter-scala = "0.26.3"
tree-sitter-swift = "0.7.4"
tree-sitter-typescript = "0.23.2"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 4
debug = false
